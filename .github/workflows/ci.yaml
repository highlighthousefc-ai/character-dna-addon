name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  RUFF_VERSION: "0.15.8"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      # Upstream code has known findings, so they are reported but don't fail the job yet.
      - name: Ruff (inherited code, report only)
        run: uvx ruff@${RUFF_VERSION} check --exit-zero src tests scripts

      - name: Ruff (our code, enforced)
        run: uvx ruff@${RUFF_VERSION} check src/addons/character_dna/dna_core tests_core scripts/ci

      - name: Ruff format
        run: uvx ruff@${RUFF_VERSION} format --check src/addons/character_dna scripts/ci tests_core

  core:
    name: dna_core (${{ matrix.os }})
    needs: [lint]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pytest
        run: python -m pip install pytest

      # Tests that need the OpenRigLogic bindings skip until the bindings build job exists.
      - name: Run dna_core tests
        run: python -m pytest tests_core -p no:cacheprovider -rs

  register:
    name: Register (${{ matrix.os }}, bpy ${{ matrix.bpy }})
    needs: [lint]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        bpy: ["5.1.*", "5.2.*"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install bpy
        run: python -m pip install "bpy==${{ matrix.bpy }}"

      - name: Register and unregister the addon
        run: python scripts/ci/register_smoke.py
