name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  RUFF_VERSION: "0.15.8"
  # OpenRigLogic 13.2.9 (main @ 1b20901); bindings-build/openriglogic-blender.patch applies to it.
  OPENRIGLOGIC_SHA: "1b20901ec6fcef119eed71a23a60ae10b3c83a44"
  SWIG_VERSION: "4.2.1"
  BLENDER_VERSION: "5.1.2"
  BLENDER_SERIES: "5.1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      # Upstream code has known findings, so they are reported but don't fail the job yet.
      - name: Ruff (inherited code, report only)
        run: uvx ruff@${RUFF_VERSION} check --exit-zero src tests scripts

      - name: Ruff (our code, enforced)
        run: uvx ruff@${RUFF_VERSION} check src/addons/character_dna/dna_core src/addons/character_dna/assembly src/addons/character_dna/runtime/python_evaluator.py tests_core scripts/ci bindings-build

      - name: Ruff format
        run: uvx ruff@${RUFF_VERSION} format --check src/addons/character_dna scripts/ci tests_core bindings-build

  bindings:
    name: Build bindings (${{ matrix.platform }}, py313)
    needs: [lint]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            tools: pefile
          - os: macos-latest
            platform: macos-arm64
            tools: ninja
    defaults:
      run:
        shell: bash
    steps:
      # Windows runners default to core.autocrlf=true, which turns OpenRigLogic's sources into
      # CRLF and makes the LF patch fail to apply.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6

      - name: Check out OpenRigLogic
        uses: actions/checkout@v6
        with:
          repository: EpicGames/OpenRigLogic
          ref: ${{ env.OPENRIGLOGIC_SHA }}
          path: OpenRigLogic

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install "swig==${SWIG_VERSION}" ${{ matrix.tools }}

      - name: Tool versions
        run: |
          python --version
          cmake --version | head -1
          swig -version | grep -i version

      - name: Apply patch
        run: git -C OpenRigLogic apply ../bindings-build/openriglogic-blender.patch

      - name: Build and stage
        run: python bindings-build/build_bindings.py --source OpenRigLogic --build build/openriglogic --out staged-bindings

      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.platform }}-py313
          path: staged-bindings/
          if-no-files-found: error

  core:
    name: dna_core (${{ matrix.platform }}, with bindings)
    needs: [bindings]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-latest
            platform: macos-arm64
    env:
      CHARACTER_DNA_BINDINGS_DIR: ${{ github.workspace }}/staged-bindings
      CHARACTER_DNA_REQUIRE_BINDINGS: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: bindings-${{ matrix.platform }}-py313
          path: staged-bindings

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # numpy is for runtime/python_evaluator (the engine's frame evaluator), tested in tests_core.
      - name: Install pytest and numpy
        run: python -m pip install pytest numpy

      - name: Run dna_core and evaluator tests
        run: python -m pytest tests_core -p no:cacheprovider -v -rs

  register:
    name: Register with bindings (${{ matrix.platform }}, bpy ${{ matrix.bpy }})
    needs: [bindings]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        bpy: ["5.1.*", "5.2.*"]
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-latest
            platform: macos-arm64
    env:
      # The addon's loader raises instead of falling back to fake modules when this is set.
      RUNNING_CI: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: bindings-${{ matrix.platform }}-py313
          path: src/addons/character_dna/bindings

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install bpy
        run: python -m pip install "bpy==${{ matrix.bpy }}"

      - name: Register and unregister the addon
        run: python scripts/ci/register_smoke.py

      - name: Round-trip and evaluate through the addon's bindings
        run: python scripts/ci/bindings_in_addon.py

      - name: Pose picker filters keep the selected pose (KI-1)
        run: python scripts/ci/pose_picker_check.py

      - name: Character assembly wires textures by manifest role (synthetic export)
        run: python scripts/ci/assembly_materials_check.py

      - name: Character assembly grooms attach to the head and follow the skin (synthetic groom)
        run: python scripts/ci/assembly_grooms_check.py

  package:
    name: Package and clean install (${{ matrix.platform }}, Blender 5.1.2)
    needs: [bindings]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            blender_archive: windows-x64.zip
          - os: macos-latest
            platform: macos-arm64
            blender_archive: macos-arm64.dmg
    defaults:
      run:
        shell: bash
    steps:
      # Keep the zip's text files byte-identical across platforms (no CRLF conversion on Windows).
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6

      # Only this platform's bindings: --split-platforms filters wheels, not other files.
      - uses: actions/download-artifact@v4
        with:
          name: bindings-${{ matrix.platform }}-py313
          path: src/addons/character_dna/bindings

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: blender
          key: blender-${{ env.BLENDER_VERSION }}-${{ matrix.blender_archive }}

      - name: Download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          url="https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-${{ matrix.blender_archive }}"
          curl -fsSL -o blender-archive "$url"
          mkdir -p blender
          if [[ "${{ matrix.blender_archive }}" == *.zip ]]; then
            7z x -y -oblender blender-archive > /dev/null
          else
            hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/blender-dmg" blender-archive > /dev/null
            cp -R "$RUNNER_TEMP/blender-dmg/Blender.app" blender/
            hdiutil detach "$RUNNER_TEMP/blender-dmg" > /dev/null
          fi
          rm blender-archive

      - name: Locate Blender
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "BLENDER=$(ls -d "$PWD"/blender/blender-*)/blender.exe" >> "$GITHUB_ENV"
          else
            echo "BLENDER=$PWD/blender/Blender.app/Contents/MacOS/Blender" >> "$GITHUB_ENV"
          fi

      - name: Build the ${{ matrix.platform }} extension zip
        run: python scripts/ci/package_extension.py --blender "$BLENDER" --platform ${{ matrix.platform }} --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: character_dna-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Install into a throwaway Blender profile
        run: |
          echo "BLENDER_USER_RESOURCES=$RUNNER_TEMP/blender-profile" >> "$GITHUB_ENV"
          BLENDER_USER_RESOURCES="$RUNNER_TEMP/blender-profile" "$BLENDER" --command extension install-file -r user_default -e dist/*.zip

      # No --factory-startup: the extension must load from the throwaway profile's preferences.
      - name: Check the installed extension
        run: '"$BLENDER" --background --python-exit-code 1 --python scripts/ci/installed_extension_check.py'
